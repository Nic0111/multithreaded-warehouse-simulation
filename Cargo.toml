[package]
name = "rts_wiki_monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
criterion = { version = "0.7", features = ["async_tokio"] }

[[bench]]
name = "pipeline"
harness = false
